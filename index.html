<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope - See Everything</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==');
            background-size: cover;
            background-attachment: fixed;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: auto;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }

        .download-button {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .download-button:hover {
            opacity: 0.8;
            transform: scale(1.02);
        }

        /* Download button positioned over the Windows download box */
        .download-button.windows {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 25%;
            max-width: 250px;
            aspect-ratio: 1;
        }

        a {
            text-decoration: none;
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-wrapper">
            <img src="https://via.placeholder.com/1200x1600?text=Scope+Landing+Page" alt="Scope - Storage Management App" id="mainImage">
            
            <!-- Invisible download button overlay -->
            <div class="download-button windows">
                <a href="https://github.com/ItzCatto/scope/releases/download/app/Scope-Setup.exe" title="Download Scope for Windows"></a>
            </div>
        </div>
    </div>

    <script>
        // Load the actual image
        const img = document.getElementById('mainImage');
        // You'll need to upload the image to your GitHub repo and link it here
        img.src = './Scope.png'; // Make sure to place Scope.png in the same directory
    </script>
</body>
</html>
