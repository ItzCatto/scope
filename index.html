<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
        }

        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .download-button {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
        }

        .download-button:hover {
            opacity: 0.85;
        }

        /* Download button positioned over the Windows download box - adjust these percentages as needed */
        .download-button.windows {
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20%;
            aspect-ratio: 1 / 1.2;
            border: 2px solid rgba(255, 0, 0, 0);
        }

        .download-button.windows:hover {
            border: 2px solid rgba(255, 0, 0, 0.1);
        }

        a {
            text-decoration: none;
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-wrapper">
            <img src="./Scope.png" alt="Scope - Storage Management App" id="mainImage">
            
            <!-- Invisible download button overlay -->
            <div class="download-button windows">
                <a href="https://github.com/ItzCatto/scope/releases/download/app/Scope-Setup.exe" title="Download Scope for Windows"></a>
            </div>
        </div>
    </div>
</body>
</html>
